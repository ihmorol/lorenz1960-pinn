name: Manuscript artifacts

on:
  push:
    branches: [dev/iceeict2027-submission]
  pull_request:
    branches: [main]
    paths:
      - "writings/iceeict2027-final/**"
      - "writings/iceeict2027-final.zip"
      - "writings/iceeict2027-manuscript.zip"
      - "scripts/verify_manuscript_artifacts.py"
      - ".github/workflows/manuscript-artifacts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify frozen paper and upload archives
        run: python3 scripts/verify_manuscript_artifacts.py
