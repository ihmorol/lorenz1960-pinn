<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Measured window handoff behavior</title>
  <desc id="desc">The next window is anchored to the previous endpoint, giving value continuity at the plotting floor, while derivative continuity is not constrained and the saved finite-difference diagnostic is of order ten to the minus three.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f83"/></marker>
  </defs>
  <rect width="1200" height="510" rx="28" fill="#ffffff"/>
  <text x="52" y="62" fill="#17344d" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700">What crosses each window interface?</text>
  <text x="52" y="98" fill="#526b7e" font-family="DejaVu Sans, Arial, sans-serif" font-size="21">Saved candidate-1536pt diagnostic · 26 interfaces</text>

  <rect x="52" y="140" width="315" height="164" rx="20" fill="#eef5f8" stroke="#c9d9e3" stroke-width="2"/>
  <text x="82" y="192" fill="#087f83" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">WINDOW k</text>
  <text x="82" y="238" fill="#17344d" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700">endpoint state</text>
  <text x="82" y="276" fill="#263a4c" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">uₖ(tₖ₊₁)</text>

  <path d="M 371 222 C 426 222, 434 222, 486 222" fill="none" stroke="#087f83" stroke-width="6" marker-end="url(#arrow)"/>
  <text x="388" y="193" fill="#087f83" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700">ANCHOR</text>

  <rect x="493" y="140" width="315" height="164" rx="20" fill="#eaf7f6" stroke="#a3d5d2" stroke-width="3"/>
  <text x="523" y="192" fill="#087f83" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">WINDOW k + 1</text>
  <text x="523" y="238" fill="#17344d" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-weight="700">hard initial state</text>
  <text x="523" y="276" fill="#263a4c" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">uₖ₊₁(tₖ₊₁) = uₖ(tₖ₊₁)</text>

  <rect x="840" y="140" width="308" height="164" rx="20" fill="#fff6e8" stroke="#e9c898" stroke-width="3"/>
  <text x="870" y="192" fill="#b97020" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700">NOT CONSTRAINED</text>
  <text x="870" y="238" fill="#17344d" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700">interface slope</text>
  <text x="870" y="276" fill="#263a4c" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">duₖ/dt ≠ duₖ₊₁/dt</text>

  <rect x="52" y="344" width="526" height="112" rx="18" fill="#eaf7f6"/>
  <text x="82" y="386" fill="#087f83" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">STATE-VALUE MISMATCH</text>
  <text x="82" y="430" fill="#17344d" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700">at the 10⁻¹⁶ plotting floor</text>

  <rect x="604" y="344" width="544" height="112" rx="18" fill="#fff6e8"/>
  <text x="634" y="386" fill="#b97020" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="700">FINITE-DIFFERENCE SLOPE MISMATCH</text>
  <text x="634" y="430" fill="#17344d" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700">remains on the order of 10⁻³</text>
</svg>