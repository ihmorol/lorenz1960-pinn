   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="10.157164" transform="rotate(-0 119 10.157164)">Lorenz-1960 initial-value problem</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="20.041992" transform="rotate(-0 119 20.041992)">u(0) = (0.5, 0.75, 1.0),  T = 13.26446</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="30.041992" transform="rotate(-0 119 30.041992)">27 equal time windows; float64 precision</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 8.9px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="49.064383" transform="rotate(-0 119 49.064383)">Separate PINN for each window k = 0, …, 26</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="59.041992" transform="rotate(-0 119 59.041992)">4 × 60 tanh; 1,536 collocation points</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="69.041992" transform="rotate(-0 119 69.041992)">Hard trial solution enforces the initial state</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="89.084508" transform="rotate(-0 119 89.084508)">Causal Adam: ε = 0.01, 0.1, 1, 10</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="99.034023" transform="rotate(-0 119 99.034023)">Recompute causal weights; detach for gradients</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="109.034023" transform="rotate(-0 119 109.034023)">Advance at verified min w &gt; 0.99 or 4,000 updates/stage</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 8.9px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="129.056039" transform="rotate(-0 119 129.056039)">L-BFGS: unweighted residual mean square</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="139.041992" transform="rotate(-0 119 139.041992)">At most 1,000 iterations per window</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9.3px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="159.084508" transform="rotate(-0 119 159.084508)">Save the window; hand off if k &lt; 26</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="169.041992" transform="rotate(-0 119 169.041992)">Next initial state = predicted endpoint</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="179.034023" transform="rotate(-0 119 179.034023)">Copy trained parameters; then train window k + 1</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8.9px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="198.564383" transform="rotate(-0 119 198.564383)">After 27 windows: compare with DOP853</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="208.541992" transform="rotate(-0 119 208.541992)">13,265 times; MAE, RMSE and maximum error</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.5px; font-family: 'Times New Roman'; text-anchor: middle; fill: #17202a" x="119" y="218.534023" transform="rotate(-0 119 218.534023)">Residual MSE, invariant drift and training cost</text>
   </g>
  </g>
